<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ethiopian Salary Calculator</title>

    <meta
        name="description"
        content="Calculate Ethiopian salary tax, deductions and estimated take-home pay."
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #123c69;
            --primary-dark: #0b2948;
            --accent: #16a085;
            --background: #f4f7fb;
            --card: #ffffff;
            --text: #172033;
            --muted: #6b7280;
            --border: #e5eaf0;
            --danger: #dc2626;
        }

        body {
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: var(--background);
            color: var(--text);
            min-height: 100vh;
        }

        /* HEADER */

        header {
            background:
                linear-gradient(
                    135deg,
                    var(--primary-dark),
                    var(--primary)
                );

            color: white;
            padding: 22px 20px;
        }

        .header-content {
            max-width: 1050px;
            margin: auto;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 46px;
            height: 46px;

            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.25);

            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 23px;
        }

        .brand h1 {
            font-size: 20px;
            font-weight: 700;
        }

        .brand p {
            font-size: 12px;
            opacity: 0.75;
            margin-top: 2px;
        }

        .country {
            font-size: 14px;
            opacity: 0.9;
        }

        /* HERO */

        .hero {
            max-width: 1050px;
            margin: 0 auto;
            padding: 48px 20px 25px;
        }

        .hero h2 {
            font-size: clamp(28px, 5vw, 44px);
            line-height: 1.1;
            margin-bottom: 14px;
            color: var(--primary-dark);
        }

        .hero p {
            max-width: 650px;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.6;
        }

        /* MAIN */

        .main {
            max-width: 1050px;
            margin: 0 auto;
            padding: 10px 20px 50px;

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;

            padding: 28px;

            box-shadow:
                0 10px 30px rgba(18, 60, 105, 0.07);
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 6px;
        }

        .card-description {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 25px;
        }

        /* FORM */

        .field {
            margin-bottom: 19px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            padding: 15px 65px 15px 15px;

            border: 1px solid #d6dce5;
            border-radius: 10px;

            font-size: 16px;
            color: var(--text);

            outline: none;
            background: #fbfcfe;

            transition: 0.2s;
        }

        input:focus {
            border-color: var(--primary);

            box-shadow:
                0 0 0 3px rgba(18, 60, 105, 0.1);

            background: white;
        }

        .currency {
            position: absolute;
            right: 14px;
            top: 50%;

            transform: translateY(-50%);

            color: var(--muted);
            font-size: 13px;
            font-weight: 600;
        }

        /* BUTTONS */

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button {
            border: none;
            border-radius: 10px;

            padding: 14px 18px;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.15s,
                box-shadow 0.15s,
                background 0.15s;
        }

        .calculate {
            flex: 1;
            background: var(--primary);
            color: white;

            box-shadow:
                0 5px 15px rgba(18, 60, 105, 0.2);
        }

        .calculate:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .reset {
            background: #eef1f5;
            color: #374151;
        }

        .reset:hover {
            background: #e2e6eb;
        }

        /* RESULTS */

        .result-card {
            min-height: 100%;
        }

        .result-placeholder {
            min-height: 300px;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            color: var(--muted);
        }

        .placeholder-icon {
            width: 65px;
            height: 65px;

            border-radius: 50%;

            background: #eef4fa;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;

            margin-bottom: 15px;
        }

        .result-content {
            display: none;
        }

        .take-home {
            background:
                linear-gradient(
                    135deg,
                    #ecfdf5,
                    #f4fffb
                );

            border: 1px solid #c9f1df;

            border-radius: 14px;

            padding: 22px;

            margin-bottom: 22px;

            text-align: center;
        }

        .take-home-label {
            color: #087f5b;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .take-home-value {
            color: #087f5b;
            font-size: clamp(30px, 5vw, 40px);
            font-weight: 800;

            margin-top: 7px;
        }

        .take-home-subtitle {
            color: #5b8b7b;
            font-size: 12px;
            margin-top: 5px;
        }

        .breakdown {
            border-top: 1px solid var(--border);
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 15px;

            padding: 14px 0;

            border-bottom: 1px solid var(--border);

            font-size: 14px;
        }

        .row span:first-child {
            color: var(--muted);
        }

        .row strong {
            text-align: right;
        }

        .tax {
            color: #c2410c;
        }

        .deduction {
            color: #b91c1c;
        }

        /* TAX INFO */

        .tax-box {
            margin-top: 22px;

            padding: 17px;

            background: #f5f8fc;

            border-radius: 12px;

            border: 1px solid var(--border);
        }

        .tax-box h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: var(--primary-dark);
        }

        .tax-box p {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 5px;
        }

        /* ERROR */

        .error {
            display: none;

            background: #fef2f2;
            border: 1px solid #fecaca;

            color: var(--danger);

            padding: 12px;
            border-radius: 9px;

            margin-top: 15px;

            font-size: 13px;
        }

        /* FOOTER */

        footer {
            background: var(--primary-dark);
            color: white;

            padding: 30px 20px;

            text-align: center;
        }

        footer strong {
            font-size: 15px;
        }

        footer p {
            color: rgba(255,255,255,0.65);
            font-size: 12px;
            margin-top: 7px;
        }

        .disclaimer {
            max-width: 700px;
            margin: 15px auto 0;

            font-size: 11px;
            color: rgba(255,255,255,0.5);
            line-height: 1.5;
        }

        /* RESPONSIVE */

        @media (max-width: 760px) {

            .header-content {
                align-items: flex-start;
            }

            .country {
                display: none;
            }

            .hero {
                padding-top: 35px;
            }

            .main {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 22px;
            }
        }

        @media (max-width: 450px) {

            .brand h1 {
                font-size: 17px;
            }

            .brand p {
                font-size: 11px;
            }

            .button-group {
                flex-direction: column;
            }

            .reset {
                width: 100%;
            }
        }

        /* ANIMATION */

        .result-content.show {
            animation: fadeIn 0.35s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

/* ===== DARK MODERN DESIGN ===== */

:root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --accent: #22c55e;
    --background: #0b1020;
    --card: #151b2e;
    --text: #f8fafc;
    --muted: #94a3b8;
    --border: #29324a;
    --danger: #f87171;
}

body {
    background:
        radial-gradient(circle at top left, #1e293b 0, #0b1020 45%, #070b16 100%);
    color: var(--text);
}

header {
    background: rgba(10, 15, 30, 0.9);
    border-bottom: 1px solid #29324a;
    backdrop-filter: blur(12px);
}

.logo {
    background: linear-gradient(135deg, #6366f1, #22c55e);
    border: none;
    box-shadow: 0 8px 25px rgba(99, 102, 241, 0.3);
}

}

.hero p {

}

.card {
    background: rgba(21, 27, 46, 0.92);
    border: 1px solid #29324a;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(12px);
}

.card-title {
    color: #f8fafc;
}

.card-description {
    color: #94a3b8;
}

label {
    color: #e2e8f0;
}

input {
    background: #0f172a;
    color: #f8fafc;
    border: 1px solid #334155;
}

input::placeholder {
    color: #64748b;
}

input:focus {
    background: #111827;
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
}

.currency {
    color: #94a3b8;
}

.calculate {
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    box-shadow: 0 8px 25px rgba(99, 102, 241, 0.3);
}

.calculate:hover {
    background: linear-gradient(135deg, #818cf8, #6366f1);
}

.reset {
    background: #252d42;
    color: #e2e8f0;
}

.reset:hover {
    background: #334155;
}

.placeholder-icon {
    background: #202941;
}

.result-placeholder {
    color: #94a3b8;
}

    background: linear-gradient(135deg, #052e1a, #0f3d2a);
    border: 1px solid #166534;
}

.take-home-value {
    color: #4ade80;

.tax-box h3 {

.tax-box p {

    color: #64748b;

    color: #475569;
}</head>

<body>

<header>

    <div class="header-content">

        <div class="brand">

            <div class="logo">
                🇪🇹
            </div>

            <div>
                <h1>Ethiopian Salary Calculator</h1>
                <p>Understand your salary. Know your take-home pay.</p>
            </div>

        </div>

        <div class="country">
            Ethiopia • ETB
        </div>

    </div>

</header>


<section class="hero">

    <h2>
        Calculate your<br>
        take-home salary.
    </h2>

    <p>
        Enter your monthly salary and deductions to estimate
        your Ethiopian employment income tax and net salary.
    </p>

</section>


<main class="main">

    <!-- CALCULATOR -->

    <section class="card">

        <div class="card-title">
            Salary details
        </div>

        <div class="card-description">
            Enter your monthly income below.
        </div>


        <div class="field">

            <label for="salary">
                Gross monthly salary
            </label>

            <div class="input-wrapper">

                <input
                    id="salary"
                    type="number"
                    min="0"
                    step="0.01"
                    placeholder="e.g. 12,000"
                >

                <span class="currency">
                    ETB
                </span>

            </div>

        </div>


        <div class="field">

            <label for="otherIncome">
                Other taxable income
            </label>

            <div class="input-wrapper">

                <input
                    id="otherIncome"
                    type="number"
                    min="0"
                    step="0.01"
                    placeholder="e.g. 0"
                >

                <span class="currency">
                    ETB
                </span>

            </div>

        </div>


        <div class="field">

            <label for="otherDeductions">
                Other deductions
            </label>

            <div class="input-wrapper">

                <input
                    id="otherDeductions"
                    type="number"
                    min="0"
                    step="0.01"
                    placeholder="e.g. 500"
                >

                <span class="currency">
                    ETB
                </span>

            </div>

        </div>


        <div class="error" id="error">
            Please enter valid amounts. Values cannot be negative.
        </div>


        <div class="button-group">

            <button
                class="calculate"
                onclick="calculateSalary()"
            >
                Calculate salary
            </button>

            <button
                class="reset"
                onclick="resetCalculator()"
            >
                Reset
            </button>

        </div>

    </section>


    <!-- RESULTS -->

    <section class="card result-card">

        <div class="card-title">
            Your results
        </div>

        <div class="card-description">
            Your estimated monthly salary breakdown.
        </div>


        <div
            class="result-placeholder"
            id="placeholder"
        >

            <div class="placeholder-icon">
                🧮
            </div>

            <strong>
                Your results will appear here
            </strong>

            <p style="font-size:13px; margin-top:6px;">
                Enter your salary and click Calculate.
            </p>

        </div>


        <div
            class="result-content"
            id="result"
        >

            <div class="take-home">

                <div class="take-home-label">
                    Estimated take-home salary
                </div>

                <div
                    class="take-home-value"
                    id="takeHome"
                >
                    0.00 ETB
                </div>

                <div class="take-home-subtitle">
                    Amount after estimated tax and deductions
                </div>

            </div>


            <div class="breakdown">

                <div class="row">
                    <span>Gross salary</span>
                    <strong id="grossResult">
                        0.00 ETB
                    </strong>
                </div>

                <div class="row">
                    <span>Other taxable income</span>
                    <strong id="otherIncomeResult">
                        0.00 ETB
                    </strong>
                </div>

                <div class="row">
                    <span>Total taxable income</span>
                    <strong id="taxableResult">
                        0.00 ETB
                    </strong>
                </div>

                <div class="row">
                    <span>Income tax</span>
                    <strong
                        class="tax"
                        id="taxResult"
                    >
                        0.00 ETB
                    </strong>
                </div>

                <div class="row">
                    <span>Other deductions</span>
                    <strong
                        class="deduction"
                        id="otherDeductionsResult"
                    >
                        0.00 ETB
                    </strong>
                </div>

                <div class="row">
                    <span>Total deductions</span>
                    <strong
                        class="deduction"
                        id="totalDeductionsResult"
                    >
                        0.00 ETB
                    </strong>
                </div>

            </div>


            <div class="tax-box">

                <h3>
                    Tax calculation
                </h3>

                <p id="taxBracket">
                    Tax bracket: -
                </p>

                <p id="taxRate">
                    Marginal tax rate: -
                </p>

                <p id="taxFormula">
                    Formula: -
                </p>

            </div>

        </div>

    </section>

</main>


<footer>

    <strong>
        🇪🇹 Ethiopian Salary Calculator
    </strong>

    <p>
        A simple tool for understanding your estimated salary.
    </p>

    <div class="disclaimer">
        This calculator provides an estimate for informational purposes.
        Actual payroll calculations may vary depending on applicable
        employment, tax, pension and other deductions.
    </div>

</footer>


<script>

function calculateSalary() {

    const salary =
        Number(document.getElementById("salary").value);

    const otherIncome =
        Number(document.getElementById("otherIncome").value || 0);

    const otherDeductions =
        Number(document.getElementById("otherDeductions").value || 0);


    if (
        !Number.isFinite(salary) ||
        !Number.isFinite(otherIncome) ||
        !Number.isFinite(otherDeductions) ||
        salary < 0 ||
        otherIncome < 0 ||
        otherDeductions < 0
    ) {

        document.getElementById("error").style.display = "block";

        return;
    }


    document.getElementById("error").style.display = "none";


    const taxableIncome =
        salary + otherIncome;


    const taxDetails =
        calculateEthiopianTax(taxableIncome);


    const tax =
        taxDetails.tax;


    const totalDeductions =
        tax + otherDeductions;


    const takeHome =
        taxableIncome - totalDeductions;


    document.getElementById("grossResult").textContent =
        formatETB(salary);

    document.getElementById("otherIncomeResult").textContent =
        formatETB(otherIncome);

    document.getElementById("taxableResult").textContent =
        formatETB(taxableIncome);

    document.getElementById("taxResult").textContent =
        formatETB(tax);

    document.getElementById("otherDeductionsResult").textContent =
        formatETB(otherDeductions);

    document.getElementById("totalDeductionsResult").textContent =
        formatETB(totalDeductions);

    document.getElementById("takeHome").textContent =
        formatETB(takeHome);


    document.getElementById("taxBracket").textContent =
        "Tax bracket: " + taxDetails.bracket;

    document.getElementById("taxRate").textContent =
        "Marginal tax rate: " + taxDetails.rate + "%";

    document.getElementById("taxFormula").textContent =
        "Formula: " + taxDetails.formula;


    document.getElementById("placeholder").style.display =
        "none";


    const result =
        document.getElementById("result");

    result.style.display = "block";

    result.classList.remove("show");

    void result.offsetWidth;

    result.classList.add("show");
}


function resetCalculator() {

    document.getElementById("salary").value = "";

    document.getElementById("otherIncome").value = "";

    document.getElementById("otherDeductions").value = "";

    document.getElementById("error").style.display = "none";

    document.getElementById("result").style.display = "none";

    document.getElementById("placeholder").style.display =
        "flex";
}


function calculateEthiopianTax(income) {

    let tax = 0;
    let rate = 0;
    let deduction = 0;
    let bracket = "";


    if (income <= 2000) {

        rate = 0;
        deduction = 0;
        bracket = "0 – 2,000 ETB";

    }

    else if (income <= 4000) {

        rate = 15;
        deduction = 300;
        bracket = "2,001 – 4,000 ETB";

    }

    else if (income <= 7000) {

        rate = 20;
        deduction = 500;
        bracket = "4,001 – 7,000 ETB";

    }

    else if (income <= 10000) {

        rate = 25;
        deduction = 850;
        bracket = "7,001 – 10,000 ETB";

    }

    else if (income <= 14000) {

        rate = 30;
        deduction = 1350;
        bracket = "10,001 – 14,000 ETB";

    }

    else {

        rate = 35;
        deduction = 2050;
        bracket = "Over 14,000 ETB";

    }


    tax =
        (income * rate / 100) - deduction;


    if (tax < 0) {
        tax = 0;
    }


    const formula =
        income.toFixed(2) +
        " × " +
        rate +
        "% - " +
        deduction.toFixed(2) +
        " = " +
        tax.toFixed(2) +
        " ETB";


    return {
        tax,
        rate,
        deduction,
        bracket,
        formula
    };
}


function formatETB(amount) {

    return amount.toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    }) + " ETB";

}

</script>

</body>
</html>
